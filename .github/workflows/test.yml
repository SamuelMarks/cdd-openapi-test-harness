  java-tests:
    runs-on: ubuntu-latest
    services:
      petstore_server:
        image: swaggerapi/petstore
        ports:
          - "8080:8080"
        env:
          SWAGGER_HOST: "http://localhost:8080"
          SWAGGER_BASE_PATH: "/v2"
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
