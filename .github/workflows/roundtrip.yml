        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD C++ Roundtrip Tests
        run: |
          set -e
          cd cdd-cpp
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-cpp..."
              mkdir -p ../temp-cpp
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-cpp-spec.json
              ./bin/cdd-cpp from_openapi to_sdk -i ../temp-cpp-spec.json -o ../temp-cpp || true
              ./bin/cdd-cpp to_openapi -i ../temp-cpp -o ../temp-cpp/spec.yaml || true
              rm -rf ../temp-cpp ../temp-cpp-spec.json
          done


  wasm-build-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Building WASM for cdd-cpp
        run: |
          set -e
          cd cdd-cpp && python3 -c "import sys; sys.path.append('scripts'); import run_pre_commit_checks as r; r.build_wasm()" && cd ..

  wasm-build-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Building WASM for cdd-csharp
        run: |
          set -e
          dotnet workload install wasm-tools
          cd cdd-csharp && make build_wasm && cd ..

  wasm-build-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
