name: cdd-roundtrip-tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  roundtrip-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'cdd-ts/package-lock.json'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies and build cdd-ts
        working-directory: cdd-ts
        run: |
          cd ../ts-morph
          npm i
          npm run build
          cd ../cdd-ts
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi
          npm run build
      - name: Run CDD Web NG Roundtrip Tests
        run: |
          set -e
          for file in OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-ts..."
              node cdd-ts/dist/cli.js from_openapi to_sdk -i "$file" --output temp-ng
              node cdd-ts/dist/cli.js to_openapi -i temp-ng/src --format yaml > temp-ng-spec.yaml
              rm -rf temp-ng temp-ng-spec.yaml
          done
  roundtrip-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run CDD Kotlin Roundtrip Tests
        run: |
          set -e
          for file in OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-kotlin..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-kt-spec.json
              cd cdd-kotlin
              ./gradlew run --args="from_openapi -i ../temp-kt-spec.json --clientName TestClient --output ../temp-kt"
              ./gradlew run --args="to_openapi -f ../temp-kt --format yaml" > ../temp-kt-spec.yaml
              cd ..
              rm -rf temp-kt temp-kt-spec.yaml temp-kt-spec.json
          done
  roundtrip-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Rust nightly
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
      - name: Run CDD Rust Scaffold Tests
        run: |
          set -e
          for file in OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-rust..."
              cd cdd-rust
              cargo run -p cdd-cli -- scaffold --openapi-path "../$file" --output-dir "../temp-rs/src/handlers"
              cargo run -p cdd-cli -- test-gen --openapi-path "../$file" --output-path "../temp-rs/tests/api_contracts.rs" --app-factory "crate::create_app"
              cd ..
              rm -rf temp-rs
          done
  roundtrip-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install and run CDD Python Client Roundtrip Tests
        run: |
          set -e
          cd cdd-python-client
          pip install pyyaml
          pip install -e .
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-python-client..."
              mkdir -p temp-py
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-py-spec.json
              cdd sync --from-openapi temp-py-spec.json --to-python temp-py/
              cdd sync --dir temp-py/
              rm -rf temp-py temp-py-spec.json
          done
          cd ..

  roundtrip-swift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Build and run CDD Swift Roundtrip Tests
        run: |
          set -e
          cd cdd-swift
          swift build -c release
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-swift..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-swift-spec.json
              .build/release/cdd-swift generate-swift temp-swift-spec.json -o temp-swift.swift
              .build/release/cdd-swift parse-swift temp-swift.swift -o temp-swift-out.json
              rm -f temp-swift-spec.json temp-swift.swift temp-swift-out.json
          done
          cd ..

  roundtrip-sh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Shell Roundtrip Tests
        run: |
          set -e
          cd cdd-sh
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-sh..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-sh-spec.json
              ./cdd.sh parse openapi temp-sh-spec.json
              ./cdd.sh emit routes temp-routes.sh
              ./cdd.sh parse routes temp-routes.sh
              ./cdd.sh emit openapi temp-sh-out.json
              rm -f temp-sh-spec.json temp-routes.sh temp-sh-out.json ast.json
          done
          cd ..

  roundtrip-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: cdd-go/go.sum
          cache: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Go Roundtrip Tests
        run: |
          set -e
          cd cdd-go
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-go..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-go-spec.json
              go run ./cmd/cdd_go from_openapi -i temp-go-spec.json -o temp-go
              go run ./cmd/cdd_go to_openapi -i temp-go -o temp-go-out.json
              rm -rf temp-go-spec.json temp-go temp-go-out.json
          done
          cd ..

  roundtrip-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD C# Roundtrip Tests
        run: |
          set -e
          cd cdd-csharp
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-csharp..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-cs-spec.json
              dotnet run --project src/Cdd.OpenApi.Cli -- from_openapi -i temp-cs-spec.json -o temp-cs
              dotnet run --project src/Cdd.OpenApi.Cli -- to_openapi -i temp-cs -o temp-cs-out.json
              rm -rf temp-cs-spec.json temp-cs temp-cs-out.json
          done
          cd ..

  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run CDD C++ Tests
        run: |
          set -e
          cd cdd-cpp && make install_base && make install_deps && make test && cd ..

  test-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Run CDD Java Tests
        run: |
          set -e
          cd cdd-java && make install_base && make install_deps && make test && cd ..

  test-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run CDD PHP Tests
        run: |
          set -e
          cd cdd-php && make install_base && make install_deps && make test && cd ..

  wasm-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: cdd-go/go.sum
          cache: true
      - name: Setting up Emscripten SDK
        run: |
          set -e
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
            cd emsdk
            ./emsdk install latest
            ./emsdk activate latest
            cd ..
          fi
          source emsdk/emsdk_env.sh
          
          echo "Building WASM for cdd-cpp"
          cd cdd-cpp && make build_wasm && cd ..
          
          echo "Building WASM for cdd-csharp"
          cd cdd-csharp && make build_wasm && cd ..
          
          echo "Building WASM for cdd-go"
          cd cdd-go && make build_wasm && cd ..
          
          echo "Building WASM for cdd-php"
          cd cdd-php && make build_wasm && cd ..
          
          echo "Building WASM for cdd-python-client"
          cd cdd-python-client && make build_wasm && cd ..

  verify-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify Compliance Dashboard
        run: |
          ./scripts/generate_dashboard.sh
          if ! git diff --exit-code ECOSYSTEM_COMPLIANCE_OAS_3_2_0.md; then
            echo "Error: ECOSYSTEM_COMPLIANCE_OAS_3_2_0.md is out of date. Please run ./scripts/generate_dashboard.sh and commit the changes."
            exit 1
          fi

