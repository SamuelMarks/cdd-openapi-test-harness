  roundtrip-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run CDD PHP Tests
        run: |
          set -e
          cd cdd-php && make install_base && make install_deps && make test && cd ..
