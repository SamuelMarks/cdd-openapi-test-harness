          cd cdd-php && make build_wasm && cd ..

  wasm-build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Building WASM for cdd-python
        run: |
          set -e
          pip install uv
          cd cdd-python-all && make build_wasm && cd ..

  verify-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify Compliance Dashboard
        run: |
          python3 ./scripts/generate_dashboard.py
          if ! git diff --exit-code ECOSYSTEM_COMPLIANCE_OAS_3_2_0.md; then
            echo "Error: ECOSYSTEM_COMPLIANCE_OAS_3_2_0.md is out of date. Please run python3 ./scripts/generate_dashboard.py and commit the changes."
            exit 1
          fi


  roundtrip-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Build and Run CDD C Roundtrip Tests
        run: |
          set -e
          cd cdd-c
          make install_base
          make install_deps
          make build
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-c..."
              mkdir -p ../temp-c
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-c-spec.json
              ./bin/cdd-c from_openapi to_sdk -i ../temp-c-spec.json -o ../temp-c || true
              ./bin/cdd-c to_openapi -i ../temp-c -o ../temp-c/spec.yaml || true
              rm -rf ../temp-c ../temp-c-spec.json
          done

  roundtrip-ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Ruby Roundtrip Tests
        run: |
          set -e
          cd cdd-ruby
          rm -f Gemfile.lock
          bundle install
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-ruby..."
              mkdir -p ../temp-rb
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-rb-spec.json
              ruby bin/cdd-ruby from_openapi to_sdk -i ../temp-rb-spec.json -o ../temp-rb || true
              ruby bin/cdd-ruby to_openapi -i ../temp-rb -o ../temp-rb/spec.yaml || true
              rm -rf ../temp-rb ../temp-rb-spec.json
          done
