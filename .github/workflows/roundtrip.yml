name: cdd-roundtrip-tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  roundtrip-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'cdd-ts/package-lock.json'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Install dependencies and build cdd-ts
        working-directory: cdd-ts
        run: |
          cd ../ts-morph
          npm i
          npm run build:node -w @ts-morph/common
          npm run build:node -w ts-morph
          cd ../cdd-ts
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi
          npm run build
      - name: Run CDD TypeScript Roundtrip Tests
        run: |
          set -e
          for file in OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-ts..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-ng-in.json
              node cdd-ts/dist/cli.js from_openapi to_sdk -i temp-ng-in.json -o temp-ng
              node cdd-ts/dist/cli.js to_openapi -i temp-ng -o temp-ng-spec.json
              rm -rf temp-ng temp-ng-in.json temp-ng-spec.json
          done

  roundtrip-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run CDD Kotlin Roundtrip Tests
        run: |
          set -e
          for file in OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-kotlin..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-kt-spec.json
              cd cdd-kotlin
              ./gradlew run --args="from_openapi to_sdk -i ../temp-kt-spec.json -o ../temp-kt"
              ./gradlew run --args="to_openapi -i ../temp-kt/composeApp/src/commonMain/kotlin/org/example/models -o ../temp-kt-spec.yaml"
              cd ..
              rm -rf temp-kt temp-kt-spec.yaml temp-kt-spec.json
          done

  roundtrip-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Rust nightly
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
      - name: Run CDD Rust Scaffold Tests
        run: |
          set -e
          for file in OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-rust..."
              cd cdd-rust
              cargo run -p cdd-cli -- from_openapi to_sdk -i "../$file" -o "../temp-rs"
              cargo run -p cdd-cli -- to_openapi -i "../temp-rs/src" -o "../temp-rs/spec.yaml"
              cd ..
              rm -rf temp-rs
          done

  roundtrip-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install and run CDD Python Client Roundtrip Tests
        run: |
          set -e
          cd cdd-python-all
          pip install pyyaml
          pip install -e .
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-python-all..."
              mkdir -p temp-py
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-py-spec.json
              cdd-python from_openapi to_sdk -i temp-py-spec.json -o temp-py
              cdd-python to_openapi -i temp-py -o temp-py-out.json
              rm -rf temp-py temp-py-spec.json temp-py-out.json
          done
          cd ..

  roundtrip-swift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Build and run CDD Swift Roundtrip Tests
        run: |
          set -e
          cd cdd-swift
          swift build -c release
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-swift..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-swift-spec.json
              .build/release/cdd-swift from_openapi to_sdk -i temp-swift-spec.json -o temp-swift
              .build/release/cdd-swift to_openapi -i temp-swift/Sources/GeneratedSDK/models.swift -o temp-swift-out.json
              rm -rf temp-swift temp-swift-spec.json temp-swift.swift temp-swift-out.json
          done
          cd ..

  roundtrip-sh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Shell Roundtrip Tests
        run: |
          set -e
          cd cdd-sh
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-sh..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-sh-spec.json
              ./cdd.sh parse openapi temp-sh-spec.json
              ./cdd.sh emit routes temp-routes.sh
              ./cdd.sh parse routes temp-routes.sh
              ./cdd.sh emit openapi temp-sh-out.json
              rm -f temp-sh-spec.json temp-routes.sh temp-sh-out.json ast.json
          done
          cd ..

  roundtrip-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: cdd-go/go.sum
          cache: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Go Roundtrip Tests
        run: |
          set -e
          cd cdd-go
          go build -o cdd-go ./cmd/cdd-go
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-go..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-go-spec.json
              ./cdd-go from_openapi to_sdk -i temp-go-spec.json -o temp-go
              ./cdd-go to_openapi -i temp-go -o temp-go-out.json
              rm -rf temp-go-spec.json temp-go temp-go-out.json
          done
          cd ..

  roundtrip-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD C# Roundtrip Tests
        run: |
          set -e
          cd cdd-csharp
          dotnet build -f net10.0 src/Cdd.OpenApi.Cli/Cdd.OpenApi.Cli.csproj
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-csharp..."
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > temp-cs-spec.json
              dotnet run --framework net10.0 --no-build --project src/Cdd.OpenApi.Cli -- from_openapi to_sdk -i temp-cs-spec.json -o temp-cs
              dotnet run --framework net10.0 --no-build --project src/Cdd.OpenApi.Cli -- to_openapi -i temp-cs -o temp-cs-out.json
              rm -rf temp-cs-spec.json temp-cs temp-cs-out.json
          done
          cd ..

  roundtrip-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run CDD C++ Tests
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
          cd cdd-cpp
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wno-unused-result"
          cmake --build build -j4
          ./build/cdd-tests
          cd ..
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD C++ Roundtrip Tests
        run: |
          set -e
          cd cdd-cpp
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-cpp..."
              mkdir -p ../temp-cpp
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-cpp-spec.json
              ./build/cdd-cpp from_openapi to_sdk -i ../temp-cpp-spec.json -o ../temp-cpp
              ./build/cdd-cpp to_openapi -i ../temp-cpp -o ../temp-cpp/spec.yaml
              rm -rf ../temp-cpp ../temp-cpp-spec.json
          done

  roundtrip-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'
      - name: Run CDD Java Tests
        run: |
          set -e
          cd cdd-java && make install_deps && mvn test && make build && cd ..
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Java Roundtrip Tests
        run: |
          set -e
          cd cdd-java
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              echo "Testing file with cdd-java..."
              mkdir -p ../temp-java
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-java-spec.json
              java -cp "lib/*:bin" cli.Main from_openapi to_sdk -i ../temp-java-spec.json -o ../temp-java
              java -cp "lib/*:bin" cli.Main to_openapi -i ../temp-java -o ../temp-java/spec.yaml
              rm -rf ../temp-java ../temp-java-spec.json
          done

  roundtrip-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run CDD PHP Tests
        run: |
          set -e
          cd cdd-php && rm -f composer.lock && composer install --no-interaction && make test && cd ..
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD PHP Roundtrip Tests
        run: |
          set -e
          cd cdd-php
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              echo "Testing file with cdd-php..."
              mkdir -p ../temp-php
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-php-spec.json
              php bin/cdd-php from_openapi to_sdk -i ../temp-php-spec.json -o ../temp-php
              php bin/cdd-php to_openapi -i ../temp-php -o ../temp-php/spec.yaml
              rm -rf ../temp-php ../temp-php-spec.json
          done

  roundtrip-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Build and Run CDD C Roundtrip Tests
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y gcc cmake pkg-config libcurl4-openssl-dev libssl-dev
          cd cdd-c
          make install_deps
          make build
          mkdir -p bin
          cp -f build_cmake/cdd-c bin/cdd-c || true
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-c..."
              mkdir -p ../temp-c
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-c-spec.json
              ./bin/cdd-c from_openapi to_sdk -i ../temp-c-spec.json -o ../temp-c
              ./bin/cdd-c to_openapi -i ../temp-c -o ../temp-c/spec.yaml
              rm -rf ../temp-c ../temp-c-spec.json
          done

  roundtrip-ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Run CDD Ruby Roundtrip Tests
        run: |
          set -e
          cd cdd-ruby
          rm -f Gemfile.lock
          bundle install
          for file in ../OAI-OpenAPI-Specification/_archive_/schemas/v3.0/pass/*.yaml; do
              filename=$(basename "$file")
              echo "Testing $filename with cdd-ruby..."
              mkdir -p ../temp-rb
              python -c "import yaml, json, sys; json.dump(yaml.safe_load(sys.stdin), sys.stdout)" < "$file" > ../temp-rb-spec.json
              bundle exec ruby bin/cdd-ruby from_openapi to_sdk -i ../temp-rb-spec.json -o ../temp-rb
              bundle exec ruby bin/cdd-ruby to_openapi -i ../temp-rb -o ../temp-rb/spec.yaml
              rm -rf ../temp-rb ../temp-rb-spec.json
          done

  wasm-build-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Building WASM for cdd-c
        run: |
          set -e
          cd cdd-c && make build_wasm && cd ..

  wasm-build-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Building WASM for cdd-cpp
        run: |
          set -e
          cd cdd-cpp && make build_wasm && cd ..

  wasm-build-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Building WASM for cdd-csharp
        run: |
          set -e
          sudo dotnet workload install wasm-tools wasm-tools-net8
          cd cdd-csharp && make build_wasm && cd ..

  wasm-build-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: cdd-go/go.sum
          cache: true
      - name: Building WASM for cdd-go
        run: |
          set -e
          cd cdd-go && make build_wasm && cd ..

  wasm-build-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Building WASM for cdd-kotlin
        run: |
          set -e
          cd cdd-kotlin && ./gradlew assemble && cd ..

  wasm-build-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Building WASM for cdd-php
        run: |
          set -e
          cd cdd-php && rm -f composer.lock && make build_wasm && cd ..

  wasm-build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Building WASM for cdd-python
        run: |
          set -e
          pip install uv
          cd cdd-python-all && make build_wasm && cd ..

  wasm-build-ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Building WASM for cdd-ruby
        run: |
          set -e
          cd cdd-ruby && python3 scripts/build_wasm.py && cd ..

  wasm-build-sh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Building WASM for cdd-sh
        run: |
          set -e
          cd cdd-sh && make build_wasm && cd ..

  verify-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify Compliance Dashboard
        run: |
          python3 ./scripts/generate_dashboard.py
          if ! git diff --exit-code ECOSYSTEM_COMPLIANCE_OAS_3_2_0.md; then
            echo "Error: ECOSYSTEM_COMPLIANCE_OAS_3_2_0.md is out of date. Please run python3 ./scripts/generate_dashboard.py and commit the changes."
            exit 1
          fi
