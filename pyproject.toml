[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdd-openapi-test-harness"
version = "0.0.4"
description = "End-to-end integration, conformance, and roundtrip test harness for the CDD OpenAPI ecosystem."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 OR MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "interrogate>=1.7.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["harness*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "cdd-*",
    "OAI-OpenAPI-Specification",
    "ts-morph",
    "emsdk",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "BLE", "SIM", "RUF", "ARG"]
ignore = [
    "D203",
    "D213",
    "UP006",
    "UP007",
    "UP035",
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "^cdd-.*",
    "^OAI-OpenAPI-Specification/",
    "^ts-morph/",
    "^emsdk/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=harness --cov=scripts --cov=build_cdd --cov=local_test --cov=run_cdd_c_sdk --cov=run_tests --cov=saboteur_server --cov=verify_coverage --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = [
    "harness",
    "scripts",
    "build_cdd",
    "local_test",
    "run_cdd_c_sdk",
    "run_tests",
    "saboteur_server",
    "verify_coverage",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
fail-under = 100
exclude = ["cdd-*", "OAI-OpenAPI-Specification", "ts-morph", "emsdk", ".git"]
verbose = 2
